<app-hero [t]="t" [textoExibido]="textoExibido()" [scrollPara]="scrollPara"></app-hero>
<app-about></app-about>

@defer (on viewport) {
<app-projects [categorias]="categorias" [categoriaAtiva]="categoriaAtiva" [projetosExibidos]="projetosExibidos"
  [filtrarPor]="filtrarPor"></app-projects>
} @placeholder {
<div class="min-h-[400px]"></div>
}

<app-skills></app-skills>

<div style="position: relative; overflow: hidden;">
  @defer (on viewport) {
  <app-career [experiencias]="experiencias"></app-career>
  } @placeholder {
  <!-- id="career" no placeholder: sem ele o fragment /#career não encontra
       alvo no DOM enquanto o @defer não é disparado. -->
  <div id="career" class="min-h-[400px]"></div>
  }
</div>

@defer (on viewport) {
<app-education></app-education>
} @placeholder {
<div class="min-h-[400px]"></div>
}

@defer (on viewport) {
<app-certificates></app-certificates>
} @placeholder {
<div class="min-h-[400px]"></div>
}

<app-contact></app-contact>
