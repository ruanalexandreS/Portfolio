<section class="hero-section relative">
    <div class="container mx-auto hero-wrapper">

        <div class="hero-text-container z-10">
            <p class="greeting text-primary font-semibold tracking-widest uppercase mb-4">
                {{ t.hero.saudacao }}
            </p>

            <h1 class="hexon-title text-text-primary font-extrabold text-5xl md:text-7xl">
                <span>{{ textoExibido }}</span>
                <span class="cursor">|</span>
            </h1>

            <h2 class="hero-subtitle text-2xl md:text-3xl font-bold mt-4">
                {{ t.hero.subtitulo }}<br>
                <span class="hero-subtitle-hl text-primary">{{ t.hero.subtituloStatus }}</span>
            </h2>

            <p class="hero-desc text-text-secondary text-lg md:text-xl mt-6 mb-8 max-w-lg">
                {{ t.hero.descricao }}
            </p>

            <div class="hero-btns">
                <div class="hero-btns-group">
                    <div class="hero-btns-row">
                        <button (click)="scrollPara('projects')" class="btn-primary">{{ t.hero.botaoProjetos }}</button>
                        <a [href]="urlCurriculo()" [download]="nomeCurriculo()" class="btn-secondary">{{ t.hero.botaoCV }}</a>
                    </div>
                    <div class="social-row">
                        <a href="https://github.com/ruanalexandreS" target="_blank" rel="noopener noreferrer" class="btn-outline">{{ t.hero.linkGithub }}</a>
                        <a href="https://www.linkedin.com/in/ruan-alexandre-/" target="_blank" rel="noopener noreferrer" class="btn-outline">{{ t.hero.linkLinkedin }}</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="hero-orbit-container">
            <div class="orbit-visual">
                <div class="orbit-stage">
                    <div class="orbit-ring-deco orbit-ring-outer"></div>
                    <div class="orbit-ring-deco orbit-ring-inner"></div>

                    <svg class="conn-svg" viewBox="0 0 550 550" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <radialGradient id="lineGrad" cx="50%" cy="50%" r="50%">
                                <!-- Cor via CSS (classe conn-stop): o atributo stop-color
                                     não resolve var(); o fade fica no stop-opacity. -->
                                <stop class="conn-stop" offset="0%" />
                                <stop class="conn-stop" offset="100%" stop-opacity="0" />
                            </radialGradient>
                        </defs>
                        <g stroke="url(#lineGrad)" stroke-width="1" stroke-dasharray="4 6">
                            <line x1="275" y1="275" x2="275" y2="35" />
                            <line x1="275" y1="275" x2="483" y2="155" />
                            <line x1="275" y1="275" x2="483" y2="395" />
                            <line x1="275" y1="275" x2="275" y2="515" />
                            <line x1="275" y1="275" x2="67" y2="395" />
                            <line x1="275" y1="275" x2="67" y2="155" />
                        </g>
                    </svg>

                    <div class="pivot p-out" style="--dur:26s; --start:0deg;">
                        <div class="tech-node" title="C#"><i class="devicon-csharp-plain colored"></i></div>
                    </div>
                    <div class="pivot p-out" style="--dur:26s; --start:60deg;">
                        <div class="tech-node" title="Angular"><i class="devicon-angular-plain" style="color:#DD0031;"></i></div>
                    </div>
                    <div class="pivot p-out" style="--dur:26s; --start:120deg;">
                        <div class="tech-node" title=".NET"><i class="devicon-dotnetcore-plain colored"></i></div>
                    </div>
                    <div class="pivot p-out" style="--dur:26s; --start:180deg;">
                        <div class="tech-node" title="SQL Server"><i
                                class="devicon-microsoftsqlserver-plain colored"></i></div>
                    </div>
                    <div class="pivot p-out" style="--dur:26s; --start:240deg;">
                        <div class="tech-node" title="TypeScript"><i class="devicon-typescript-plain colored"></i>
                        </div>
                    </div>
                    <div class="pivot p-out" style="--dur:26s; --start:300deg;">
                        <div class="tech-node" title="Git"><i class="devicon-git-plain colored"></i></div>
                    </div>

                    <div class="pivot p-in" style="--dur:19s; --start:0deg;">
                        <div class="tech-node" title="Docker"><i class="devicon-docker-plain colored"></i></div>
                    </div>
                    <div class="pivot p-in" style="--dur:19s; --start:120deg;">
                        <div class="tech-node tech-node-text" title="Azure"><span>AZURE</span></div>
                    </div>
                    <div class="pivot p-in" style="--dur:19s; --start:240deg;">
                        <!-- var(--color-silver): no dark resolve #94A3B8 (idêntico ao
                             antigo hardcode); no light #64748B = 4.35:1 no node branco -->
                        <div class="tech-node" title="GitHub"><i class="devicon-github-original" style="color: var(--color-silver);"></i></div>
                    </div>

                    <img src="assets/minhafoto.webp" alt="Ruan Alexandre" class="profile-img">
                </div>
            </div>
        </div>

    </div>
</section>
