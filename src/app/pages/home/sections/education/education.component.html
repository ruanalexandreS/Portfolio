<!-- 6. FORMAÇÃO ACADÊMICA -->
<section id="education" class="py-20 border-y border-border-base">
    <div class="container mx-auto px-6">

        <div class="text-center mb-4">
            <h2 class="education-title section-title">{{ t.titulos.educacao }}</h2>
            <p class="text-text-secondary section-subtitle mt-2">{{ t.titulos.educacaoSub }}</p>
            <span class="about-divider"></span>
        </div>

        <div class="education-grid">
            @for (edu of t.educacao.itens; track edu.curso; let i = $index) {
            <div class="education-card">
                <div class="education-card-left">
                    <div class="education-icon"
                        [style.background]="i === 0 ? 'rgba(124,92,255,0.1)' : 'rgba(56,189,248,0.1)'"
                        [style.borderColor]="i === 0 ? 'rgba(124,92,255,0.3)' : 'rgba(56,189,248,0.3)'">
                        @if (i === 0) {
                        <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" width="28" height="28">
                            <path d="M12 14l9-5-9-5-9 5 9 5z" />
                            <path
                                d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                        </svg>
                        } @else {
                        <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-tertiary)" stroke-width="1.5" width="28" height="28">
                            <path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                        </svg>
                        }
                    </div>
                    <div class="education-status-dot education-dot-active"
                        [style.background]="i === 0 ? '' : 'var(--color-tertiary)'"></div>
                </div>
                <div class="education-card-body">
                    <div class="education-card-header">
                        <div>
                            <h3 class="education-institution">{{ edu.instituicao }}</h3>
                            <p class="education-degree">{{ edu.curso }}</p>
                            <p class="education-period">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                                    width="13" height="13">
                                    <rect x="3" y="4" width="18" height="18" rx="2" />
                                    <line x1="16" y1="2" x2="16" y2="6" />
                                    <line x1="8" y1="2" x2="8" y2="6" />
                                    <line x1="3" y1="10" x2="21" y2="10" />
                                </svg>
                                {{ edu.periodo }}
                            </p>
                        </div>
                        <span class="education-badge education-badge-active">{{ edu.status }}</span>
                    </div>
                    <p class="education-desc">{{ edu.descricao }}</p>
                    <div class="education-tags">
                        @for (tag of edu.tags; track tag) {
                        <span class="education-tag">{{ tag }}</span>
                        }
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</section>
