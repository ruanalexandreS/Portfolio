<section id="about" class="about-section py-20 border-y border-border-base">
    <div class="container mx-auto px-6">
        <h1 class="about-title">{{ t.sobre.titulo }}</h1>
        <span class="about-divider"></span>
        <div class="about-grid grid md:grid-cols-2 gap-12 items-center">
            <div class="about-photo-side">
                <div class="about-frame mx-auto">
                    <div class="about-photo-bg"></div>
                    <div class="about-placeholder">
                        <img src="assets/foto2.png" [alt]="t.sobre.titulo" class="about-photo-img" />
                    </div>
                    <div class="badge-float badge-code-blue">&lt;/&gt;</div>
                    <div class="badge-float badge-aws-soon">AWS</div>
                    <div class="badge-float badge-docker">
                        <i class="devicon-docker-plain colored"></i>
                    </div>
                </div>
            </div>
            <div class="about-text-side">
                <h2 class="about-subtitle text-3xl font-bold mb-6">
                    {{ t.sobre.subtituloLinha1 }}<br>{{ t.sobre.subtituloLinha2 }}
                </h2>
                <p class="silver-text mb-4 text-lg leading-relaxed">{{ t.sobre.paragrafo1 }}</p>
                <p class="silver-text mb-4 text-lg leading-relaxed">{{ t.sobre.paragrafo2 }}</p>
                <p class="silver-text mb-6 text-lg leading-relaxed">{{ t.sobre.paragrafo3 }}</p>
                <div class="tech-badges flex flex-wrap gap-3">
                    <span class="t-badge b-teal">{{ t.sobre.badgeBackend }}</span>
                    <span class="t-badge b-blue">{{ t.sobre.badgeAws }}</span>
                    <span class="t-badge b-gold">{{ t.sobre.badgeJunior }}</span>
                </div>
            </div>
        </div>
    </div>
</section>
