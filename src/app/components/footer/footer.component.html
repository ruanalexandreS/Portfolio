<!-- 9. FOOTER -->
<footer class="footer-custom">
    <div class="footer-top container mx-auto px-6">

        <div class="footer-logo">
            Ruan<span>.dev</span>
            <span class="footer-icons">
                <span class="footer-icon-cyan">&lt;/&gt;</span>
                <span class="footer-icon-yellow">+</span>
                <span class="footer-icon-purple">☁</span>
            </span>
        </div>

        <p class="footer-copy">
            {{ t.footer.direitos }}
        </p>

        <nav class="footer-nav">
            <a href="#about">{{ t.footer.navSobre }}</a>
            <a href="#projects">{{ t.footer.navProjetos }}</a>
            <a href="#career">{{ t.footer.navCarreira }}</a>
            <a href="#contact">{{ t.footer.navContato }}</a>
        </nav>

    </div>

    <div class="footer-divider"></div>

    <div class="footer-tagline container mx-auto px-6">
        {{ t.footer.taglineLinha1 }} •
        {{ t.footer.taglineLinha2 }} •
        <span class="footer-tag-hl-blue">{{ t.footer.taglineHighlight1 }}</span> •
        <span class="footer-tag-hl-teal">{{ t.footer.taglineHighlight2 }}</span>
    </div>
</footer>
